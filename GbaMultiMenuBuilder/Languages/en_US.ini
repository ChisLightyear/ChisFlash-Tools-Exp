[grid_tooltip]
sequence=Shows the current row number in the list.
use=Controls whether this ROM is included in the current build.
title=Name shown in the menu. Editing this does not rename the ROM file.
game_title=Original title read from the ROM header. This column is read-only and does not directly change the menu title.
mbc_type=Detected mapper/controller family read from the ROM header.
save_support=Shows the current save mode: dedicated or shared; displays - when the ROM has no RAM.
save_allocation=Checked means dedicated area, unchecked means shared; disabled when the ROM has no RAM.
ram_size=Detected external RAM capacity code read from the ROM header.
rom_size=Detected ROM capacity code read from the ROM header.
rom_path=Full path to the source ROM file.
save_type=Save type detected from the ROM, including recognized SRAM-patched titles.
patch_conversion=Shows whether this ROM needs SRAM patch conversion and whether the current builder supports it.
sram_patch=Controls whether to apply the SRAM patch for this ROM when a supported patch target is available.
batteryless_patch=Controls whether to apply the batteryless patch for this ROM. Only available in No Battery mode after SRAM save handling is ready.
batteryless_status=Shows whether the ROM is already batteryless-patched, whether SRAM prep is complete, and whether there is room to place the batteryless payload.
file_size=Shows the original ROM file size in MiB.
occupied_size=Shows the final cartridge occupancy in MiB after alignment and batteryless expansion.
save_slot=Menu-managed save slot number. Games can share one slot. Leave empty or set none for no slot.
hidden_keys=This ROM only appears when these keys are held while the menu boots, for example L,R,DOWN.
map_256m=Places the ROM on a 256M-aligned region to avoid mapper compatibility issues on some flashcarts.
font=Menu font index used to draw the title.

