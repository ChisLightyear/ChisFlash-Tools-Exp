[build_settings_tooltip]
language=Switches the UI display language and refreshes the current window immediately.
base_menu=Selects the base menu ROM used as the menu core for the compilation.
output_rom=Sets the output file name and path for the generated compilation ROM.
background=Optionally replaces the menu background image with a custom picture.
cover_directory=Selects the folder containing cover_index.csv and cover images for the NS menu.
gbc_background=Optionally uses an exact 160x144 image as the GBC menu background.
compilation_family=Switches between the GBA and GBC workspaces. Each family restores its own saved build settings and ROM list.
cartridge_type=Chooses the target capacity preset used for the 01G/02G layout and compatibility workflow.
flashcart_type=Chooses a preset flashcart mode and links related detailed settings automatically.
gba_menu_type=Selects the GBA menu interface independently from the flashcart hardware and save mode.
minimal_menu_package=Outputs only the 0x0B0000 NS menu and covers for replacing the classic menu; the configuration area is not written or changed.
min_rom_size=Sets the smallest ROM allocation unit supported by the cartridge and affects alignment.
battery_present=Enables battery-backed save handling for menu-managed save slots.
split_output=Exports the final ROM in 32 MiB split parts for compatible flashing workflows.
gbc_font_source=Requires a 12px font for GBC Chinese glyph generation and preview. 8px fonts are not supported.

