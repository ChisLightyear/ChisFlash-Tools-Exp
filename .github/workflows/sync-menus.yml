name: Sync bundled NS menus

on:
  workflow_dispatch:
    inputs:
      menu_tag:
        description: "Menu release tag (for example, v2026.11.27-r5)"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: bundled-ns-menu-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the client repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download and sync the selected menu release
        env:
          MENU_TAG: ${{ inputs.menu_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ ! "$MENU_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-r[0-9]+)?$ ]]; then
            echo "Enter a menu release tag such as v2026.11.27-r5."
            exit 1
          fi
          source="https://github.com/ChisLightyear/ChisFlash-Multicart-Menus/releases/download/$MENU_TAG"
          staging="$RUNNER_TEMP/bundled-ns-menus"
          assets="ChisFlashWaterClient/Assets"
          mkdir -p "$staging"
          for file in menu_NS.gba menu_NSLite.gba; do
            curl --fail --silent --show-error --location "$source/$file" --output "$staging/$file"
          done
          install -m 0644 "$staging/menu_NS.gba" "$staging/menu_NSLite.gba" "$assets/"
          printf '%s\n' "$MENU_TAG" > "$assets/menu-version.txt"
          git add -- "$assets/menu_NS.gba" "$assets/menu_NSLite.gba" "$assets/menu-version.txt"
          if git diff --cached --quiet; then
            echo "The client already bundles $MENU_TAG."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Sync bundled NS menus to $MENU_TAG"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
