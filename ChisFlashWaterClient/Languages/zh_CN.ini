update_menu_wl_confirm_message=要把当前卡带更新到自带的 WL 菜单吗？\n\n这将会：\n1. 擦除 0x000000-0x3FFFFF\n2. 刷入自带的 WL 菜单\n3. 回写游戏表、状态区和 WL 映射区\n4. 依据当前卡带状态重建 {0} 条可见菜单项\n\n游戏 ROM 数据不会被擦除，现有存档也不会被触碰。\n如果当前还是旧菜单，本次会同时切换到新菜单。\n\n本次涉及的 4MiB 区块数: {1}\n\n是否继续？
force_rebuild_menu_wl_confirm_message=要强制重建魔术菜单吗？\n\n这将会：\n1. 擦除并重写 0x000000-0x3FFFFF\n2. 刷入自带的 WL 魔术菜单\n3. 按当前能识别到的菜单/WL 映射/NOR 头部重建游戏表、状态区和 WL 映射区\n4. 保留头部 4 MiB 之外的游戏 ROM 数据\n\n如果原来有 WL 映射，会按映射重建并整理；如果当前是空卡/空列表，会写入空映射。\n\n条目数={0}，涉及 4MiB 区块={1}\n\n是否继续？
force_rebuild_menu_wl_head_confirm_message=要强制重建魔术菜单吗？\n\n头部前 4 MiB 当前被这个游戏占用：\n{0}\n\n继续后将会：\n1. 擦除并重写 0x000000-0x3FFFFF\n2. 刷入自带的 WL 魔术菜单\n3. 按当前能识别到的菜单/WL 映射/NOR 头部重建游戏表、状态区和 WL 映射区\n4. 保留头部 4 MiB 之外的游戏 ROM 数据\n\n这会破坏上面的头部游戏。\n\n条目数={1}，涉及 4MiB 区块={2}\n\n是否继续？
update_menu_legacy_confirm_message=要把当前卡带更新到自带的旧菜单吗？\n\n这将会：\n1. 擦除 0x000000-0x3FFFFF\n2. 刷入自带的旧菜单\n3. 回写游戏表和状态区\n4. 保留当前可见菜单顺序并重写 {0} 条菜单项\n\n游戏 ROM 数据不会被擦除，现有存档也不会被触碰。\n\n是否继续？
update_gba_menu_confirm_message=要把当前卡带更新到所选 GBA 菜单吗？\n\n这将会：\n1. 擦除 0x000000-0x3FFFFF\n2. 刷入所选 GBA 菜单\n3. 回写游戏表和状态区\n4. 保留当前可见菜单顺序并重写 {0} 条菜单项\n5. 当前和目标菜单都支持封面时保留现有封面包\n\n游戏 ROM 数据不会被擦除，现有存档也不会被触碰。\n\n是否继续？
update_gba_menu_battery_confirm_message=要把当前卡带更新到所选 GBA 菜单吗？\n\n这将会：\n1. 重写 GBA 菜单区 0x000000-0x{1:X6}\n2. 保留存档区 0x{2:X6}-0x3FFFFF\n3. 回写游戏表和状态区\n4. 保留当前可见菜单顺序并重写 {0} 条菜单项\n5. 当前和目标菜单都支持封面时保留现有封面包\n\n游戏 ROM 数据不会被擦除，现有存档也不会被触碰。\n\n是否继续？
upgrade_magic_confirm_title=更新至魔术管理
upgrade_magic_confirm_message=要把当前卡带升级到魔术管理吗？\n\n这将会：\n1. 更新菜单 ROM 到 0x000000-0x{0:X6}\n2. 重写游戏表扇区 0x{5:X6}-0x{6:X6}\n3. 写入 WL 映射区 0x{1:X6}-0x{2:X6}\n4. 根据实际 NOR 头扫描结果构建 {3} 条映射记录\n\n游戏 ROM 数据不会被擦除，现有存档也不会被触碰。\n没有匹配 NOR 头的旧菜单残留条目会被丢弃: {7}\n旧菜单里缺失但 NOR 里实际存在的游戏会被补入: {8}\n\n本次涉及的 4MiB 区块数: {4}
repair_magic_confirm_title=修复魔术管理
repair_magic_confirm_message=要修复当前卡带的魔术管理元数据吗？\n\n这将会：\n1. 重写游戏表扇区 0x{0:X6}-0x{1:X6}\n2. 重写状态扇区 0x{2:X6}-0x{3:X6}\n3. 重写 WL 映射区 0x{4:X6}-0x{5:X6}\n4. 依据当前 WL 映射记录重建 {6} 条可见条目\n5. 清除 {7} 条仅残留在 itemlist 的旧条目\n\n检测到的失配情况：\n- 仅 itemlist 槽位: {8}\n- 仅映射槽位: {9}\n- 槽位内容不一致: {10}\n- 映射槽位不连续: {11}\n\nROM 数据和存档数据都不会被擦除。\n\n是否继续？
repair_magic_confirm_message_legacy=检测到需要重建的 WL 映射区。\n\n这将会：\n1. 重写游戏表扇区 0x{0:X6}-0x{1:X6}\n2. 重写状态扇区 0x{2:X6}-0x{3:X6}\n3. 重写 WL 映射区 0x{4:X6}-0x{5:X6}\n4. 依据当前 itemlist 重建 {6} 条可见条目的新版映射记录\n5. 把卡带升级到新版带校验的 WL 映射格式\n\nROM 数据和存档数据都不会被擦除。\n\n是否继续？
