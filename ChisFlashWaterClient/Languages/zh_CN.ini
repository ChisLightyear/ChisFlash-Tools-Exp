beggar_max_update_menu_clear_config_prompt=是否清除配置区？\n\n是：清空当前 MBCX 目录，完整擦除并重写头部 1 MiB，刷入全新的空 MAX/MBCX 菜单。\n否：继承当前目录，更新菜单，并根据当前识别到的 {0} 个槽位重建索引。\n取消：不操作。\n\n1 MiB 之后的游戏 ROM 数据不会被擦除。清空后，在再次导入至少一个游戏前，当前老菜单会显示 NO MENU LAYERS。{1}
