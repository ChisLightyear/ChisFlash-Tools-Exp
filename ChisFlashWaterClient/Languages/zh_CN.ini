force_rebuild_menu_clear_config_prompt=是否清除配置区？\n\n是：清空当前游戏表/WL 映射，完整擦写头部 4 MiB，并刷入全新的空 WL 魔术菜单。\n否：继承当前配置区，使用新版菜单内置背景更新菜单，并按当前配置回写游戏表、状态区和 WL 映射区。\n取消：不操作。
force_rebuild_menu_clear_config_head_prompt=是否清除配置区？\n\n头部前 4 MiB 当前检测到：\n{0}\n\n是：清空当前游戏表/WL 映射，完整擦写头部 4 MiB，并刷入全新的空 WL 魔术菜单。\n否：继承当前配置区，使用新版菜单内置背景更新菜单，并按当前配置回写游戏表、状态区和 WL 映射区。\n取消：不操作。\n\n写入菜单会覆盖上面的头部游戏。
