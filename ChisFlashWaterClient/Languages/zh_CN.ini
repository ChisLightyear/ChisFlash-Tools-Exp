repair_menu_wl_confirm_message=当前卡内未识别到菜单配置。\n\n继续后将会：\n1. 擦除 0x000000-0x3FFFFF\n2. 刷入新的 WL 菜单\n3. 回写游戏表、状态区和 WL 映射区\n4. 依据当前 NOR 头部重建 {0} 条可见菜单项\n5. 生成水线合卡\n\n本次涉及的 4MiB 区块数: {1}\n\n是否继续？
