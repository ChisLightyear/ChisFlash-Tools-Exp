repair_legacy_save_slots_confirm_message=当前卡带处于有电池/铁电模式，但一个或多个旧菜单条目仍是 save=NONE。\n\n继续后将会：\n1. 重写游戏表扇区 0x{0:X6}-0x{1:X6}\n2. 重写状态区扇区 0x{2:X6}-0x{3:X6}\n3. 为当前 {4} 条菜单项分配旧菜单 SRAM 存档槽\n\nROM 数据不会被擦除。\n\n是否继续？
