repair_menu_wl_from_legacy_confirm_message=当前选择的是 WaterLink 烧录卡，但卡内检测到旧菜单配置。\n\n继续后将会：\n1. 刷入自带的 WL 菜单\n2. 按当前旧菜单 itemlist/status 重建 {0} 条 WL 游戏表、状态区和映射区\n3. 保留当前游戏 ROM 数据\n\n本次涉及的 4MiB 区块数: {1}\n\n是否继续？
