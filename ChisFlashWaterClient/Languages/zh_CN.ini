erase_config_confirm_message=这会直接擦除 0x000000-0x3FFFFF。\n\n头部 4 MiB 区域内的当前菜单和配置数据都会被清掉。\n\n是否继续？
erase_config_confirm_message_with_game=头部前 4 MiB 当前被这个游戏占用：\n{0}\n\n继续后会直接擦除 0x000000-0x3FFFFF。\n\n这会清掉当前菜单、配置数据，以及上面的头部游戏。\n\n是否继续？
erase_config_confirm_message_gbc=这会直接擦除 0x000000-0x0FFFFF。\n\nMBCX 头部 1 MiB 区域内的当前菜单、配置和固定目录数据都会被清掉。1 MiB 之后的游戏 ROM 数据会保留。\n\n是否继续？
erase_entire_nor_confirm_message=检测结果：{0}\n容量：{1} MiB\n擦除目标数：{2}（掩码 0x{3:X}）\n\n这会永久擦除整片 NOR，包括菜单、所有游戏 ROM、免电存档，以及保存在 NOR 中的其他存档。SPI/FRAM 存档芯片不会被擦除。\n\n对于堆叠式 2 Gbit/02G NOR 和 multi-NOR 卡，每个检测到的 128 MiB 目标都会分别执行擦除。\n\n是否继续？
erase_entire_nor_final_confirm_message=最后确认：NOR 中的全部内容将被不可逆地擦除。是否继续？
unlock_ppb_confirm_message=检测结果：{0}\n\n这会清除这张 GBA Flash 卡上的全部持久扇区保护位（PPB）。ROM 和存档数据不会被擦除，但所有 NOR 扇区都会恢复为可写。\n\n是否继续？
unlock_ppb_confirm_message_gbc=检测结果：{0}\n\n这会清除这张 GBC Flash 卡上的全部持久扇区保护位（PPB）。ROM 和存档数据不会被擦除，但所有 Flash 扇区都会恢复为可写。\n\n是否继续？
