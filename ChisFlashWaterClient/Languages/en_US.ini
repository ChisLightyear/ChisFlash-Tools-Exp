upgrade_magic_confirm_message=Upgrade this cart to Magic mode?\n\nThis will:\n1. Update menu ROM at 0x000000-0x{0:X6}\n2. Rewrite itemlist sector at 0x{5:X6}-0x{6:X6}\n3. Write WL mapping sector at 0x{1:X6}-0x{2:X6}\n4. Build {3} mapping records from actual NOR-detected ROMs\n\nGame ROM data will not be erased. Existing save data will not be touched.\nLegacy menu-only entries without a matching NOR header will be dropped: {7}\nHeader-only ROMs missing from the old menu will be added: {8}\n\nMapped 4MiB buckets this time: {4}
