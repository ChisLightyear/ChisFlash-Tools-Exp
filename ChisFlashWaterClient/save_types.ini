# Save type recognition rules.
# Format:
# SIGNATURE=VersionDigitCount
# SIGNATURE=Kind|VersionDigitCount
#
# Notes:
# - Sections are grouped by major type: EEPROM, FLASH, SRAM.
# - VersionDigitCount=0 means exact string match.
# - If Kind is omitted, the section default kind is used.
# - Valid kinds: Eeprom, Flash, Flash512, Flash1M, Sram.

[EEPROM]
EEPROM_V=3

[FLASH]
FLASH1M_V=Flash1M|3
FLASH512_V=Flash512|3
FLASH512=Flash512|0
FLASH_V=3

[SRAM]
SRAM_F_V=3
SRAM_V=3
